name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # 腳本有 BSD／GNU 兩套分支（stat、date、shasum／sha256sum），兩邊都要驗
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安裝器行為測試
        run: bash tests/install.test.sh

      - name: 主動稽核防線測試
        run: bash tests/audit.test.sh

      - name: 執行期主動防線 Hook 測試（python3 與 bash fallback 兩種模式）
        run: bash tests/hook-guard.test.sh

      - name: 團隊策略檔搜尋與解析測試
        run: bash tests/policy.test.sh

      - name: 團隊導入、同步與團隊守則測試
        run: bash tests/team.test.sh

      - name: 遠端免 clone 安裝腳本測試
        run: bash tests/remote-install.test.sh

      - name: 守則體檢與修復測試
        run: bash tests/doctor.test.sh

      - name: Agent 自省審查測試
        run: bash tests/review.test.sh

      - name: frontmatter 與 core 行數預算
        run: scripts/check-budget.sh

      - name: frontmatter 預算檢查測試
        run: bash tests/check-budget.test.sh

      - name: 守則內容檢查（結構、空泛用語、重複、長度）
        run: scripts/lint-rules.sh

      - name: 守則內容檢查測試
        run: bash tests/lint-rules.test.sh

      - name: 守則評測框架離線測試（不呼叫 API）
        run: bash tests/eval.test.sh

      - name: 守則淘汰與審查期限測試
        run: bash tests/deprecation.test.sh

      - name: schema 與規則庫、策略檔範本一致
        run: scripts/check-schema.sh

      - name: 守則與機器檢查連動測試
        run: bash tests/check-schema.test.sh

      - name: 英文守則與中文來源同步
        run: scripts/check-i18n.sh

      - name: 翻譯同步與 --lang 安裝測試
        run: bash tests/i18n.test.sh

      - name: 事故回報草稿與去識別化測試
        run: bash tests/incident-draft.test.sh

      - name: 識別資訊掃描（CI 沒有私人禁用詞清單，只跑內建規則）
        run: scripts/sanitize-check.sh

      - name: 版號一致（plugin.json、marketplace.json、CHANGELOG）
        run: scripts/check-version.sh

      - name: 版號檢查腳本測試
        run: bash tests/check-version.test.sh
