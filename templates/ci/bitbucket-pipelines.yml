# Agent Agreements Audit for Bitbucket Pipelines
# 放在專案根目錄的 bitbucket-pipelines.yml

image: alpine:latest

pipelines:
  pull-requests:
    '**':
      - step:
          name: Agent Agreements Guardrail Audit
          script:
            - apk add --no-cache bash git
            - |
              if [ -f "scripts/audit.sh" ]; then
                bash scripts/audit.sh --commit HEAD
              else
                echo "Notice: scripts/audit.sh not found."
              fi
  branches:
    main:
      - step:
          name: Agent Agreements Guardrail Audit
          script:
            - apk add --no-cache bash git
            - |
              if [ -f "scripts/audit.sh" ]; then
                bash scripts/audit.sh --commit HEAD
              else
                echo "Notice: scripts/audit.sh not found."
              fi
